name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create (e.g. v1.0.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test
      - run: dotnet publish src/Hades-Editor -c Release -r win-x64 -o publish -p:Version=$($env:TAG.TrimStart('v'))
      - run: Compress-Archive publish/hades-editor.exe, README.md, LICENSE "hades-editor-$env:TAG-win-x64.zip"
      - run: gh release create $env:TAG "hades-editor-$env:TAG-win-x64.zip" --draft --target $env:GITHUB_SHA --generate-notes
